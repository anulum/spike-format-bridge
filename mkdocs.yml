# SPIKE-FORMAT-BRIDGE — repository foundation

site_name: Spike Format Bridge
site_description: Repository validation and planned recording-conversion boundaries
strict: true
docs_dir: docs
site_dir: .tool-cache/site
exclude_docs: |
  internal/
theme:
  name: material
nav:
  - Overview: index.md
  - Architecture: ARCHITECTURE.md
  - Validation tooling: validation-tooling.md
  - Trust boundaries: THREAT_MODEL.md
  - Repository boundary: adr/0001-repository-boundary.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [tools]
          options:
            allow_inspection: false
            docstring_style: numpy
            show_source: false
            show_signature_annotations: true
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
